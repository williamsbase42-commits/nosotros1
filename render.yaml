databases:
  - name: nosotros-db
    databaseName: nosotros
    user: nosotros
    plan: free

services:
  - type: web
    name: nosotros
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: gunicorn nosotros.wsgi:application --bind 0.0.0.0:$PORT --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nosotros-db
          property: connectionString
      - key: EDITOR_PASSWORD
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
