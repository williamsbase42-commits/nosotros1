<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aventuras de Ayelen y Williams</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: linear-gradient(#fddde6, #ffe6f0); overflow: hidden; font-family: sans-serif; }
    canvas { display: block; background: url('https://i.imgur.com/dYcYQ7E.png') repeat-x; background-size: cover; }
    #info {
      position: absolute; top: 10px; left: 10px; padding: 10px;
      background: rgba(255, 255, 255, 0.8); border-radius: 8px;
      font-size: 16px; color: #ff69b4;
    }
  </style>
</head>
<body>
  <div id="info">❤️ Usa ← → para moverte y espacio para saltar</div>
  <canvas id="juego" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById('juego');
    const ctx = canvas.getContext('2d');

    const gravedad = 0.6;

    const jugador = {
      x: 50,
      y: 300,
      w: 40,
      h: 40,
      color: '#ff69b4',
      vx: 0,
      vy: 0,
      enSuelo: false
    };

    const teclas = {
      izquierda: false,
      derecha: false,
      salto: false
    };

    const corazones = Array.from({ length: 5 }, () => ({
      x: Math.random() * 700 + 100,
      y: 300,
      w: 20,
      h: 20,
      recolectado: false
    }));

    function dibujarJugador() {
      ctx.fillStyle = jugador.color;
      ctx.fillRect(jugador.x, jugador.y, jugador.w, jugador.h);
    }

    function dibujarCorazones() {
      ctx.fillStyle = 'red';
      corazones.forEach(c => {
        if (!c.recolectado) ctx.fillRect(c.x, c.y, c.w, c.h);
      });
    }

    function aplicarFísica() {
      if (teclas.izquierda) jugador.vx = -3;
      else if (teclas.derecha) jugador.vx = 3;
      else jugador.vx = 0;

      jugador.vy += gravedad;
      jugador.x += jugador.vx;
      jugador.y += jugador.vy;

      // suelo
      if (jugador.y + jugador.h >= canvas.height) {
        jugador.y = canvas.height - jugador.h;
        jugador.vy = 0;
        jugador.enSuelo = true;
      } else {
        jugador.enSuelo = false;
      }
    }

    function verificarColisiones() {
      corazones.forEach(c => {
        if (!c.recolectado &&
            jugador.x < c.x + c.w &&
            jugador.x + jugador.w > c.x &&
            jugador.y < c.y + c.h &&
            jugador.y + jugador.h > c.y) {
          c.recolectado = true;
        }
      });
    }

    function bucle() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      aplicarFísica();
      verificarColisiones();
      dibujarCorazones();
      dibujarJugador();
      requestAnimationFrame(bucle);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') teclas.izquierda = true;
      if (e.key === 'ArrowRight') teclas.derecha = true;
      if (e.key === ' ' && jugador.enSuelo) {
        jugador.vy = -12;
      }
    });

    document.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft') teclas.izquierda = false;
      if (e.key === 'ArrowRight') teclas.derecha = false;
    });

    bucle();
  </script>
</body>

<script>
    // Nueva función para animación abrazo
function animarAbrazo() {
  let abrazoFrame = 0;
  const totalFrames = 60; // duración de la animación en frames (1s aprox)
  const inicioX = williams.x;
  const destinoX = ayelen.x - williams.width + 10; // posición pegada a Ayelen

  function animar() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    // Fondo y suelo
    ctx.fillStyle = "#ffc0cb";
    ctx.fillRect(0, HEIGHT - 20, WIDTH, 20);

    // Dibujar Ayelen
    ctx.drawImage(imgAyelen, ayelen.x, ayelen.y, ayelen.width, ayelen.height);

    // No dibujamos obstáculos en esta animación

    // Mover Williams hacia Ayelen
    williams.x = inicioX + ((destinoX - inicioX) * (abrazoFrame / totalFrames));

    // Dibujar Williams
    ctx.drawImage(imgWilliams, williams.x, williams.y, williams.width, williams.height);

    // Efecto corazón parpadeante arriba
    if (abrazoFrame % 20 < 10) {
      ctx.fillStyle = "#ff69b4";
      ctx.font = "40px Arial";
      ctx.fillText("❤️", williams.x + 20, williams.y - 10);
    }

    abrazoFrame++;
    if (abrazoFrame <= totalFrames) {
      requestAnimationFrame(animar);
    } else {
      // Mostrar mensaje final
      ctx.clearRect(0, 0, WIDTH, HEIGHT);
      ctx.fillStyle = "#ff69b4";
      ctx.font = "30px Arial";
      ctx.textAlign = "center";
      ctx.fillText("¡Williams y Ayelen están juntos! ❤️", WIDTH/2, HEIGHT/2);
    }
  }
  animar();
}
// Detectar llegada al final (Ayelen)
if(williams.x + williams.width >= ayelen.x) {
  juegoTerminado = true;
  musicaFondo.pause();
  animarAbrazo();
  setTimeout(() => {
    if(nivel === 1) {
      nivel = 2;
      puntaje += 10;
      reiniciarJuego();
    } else {
      puntaje += 20;
      alert('¡Felicidades! Has completado todos los niveles.');
      reiniciarJuego(true);
    }
  }, 3000); // 3 segundos para que se vea la animación
  return;
}

</script>
</html>
