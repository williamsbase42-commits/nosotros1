<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="juego-memoria" style="margin-top: 60px;">
  <h2>🧠 Juego de Memoria Pochacco 🧠</h2>
  <p>Haz clic para emparejar las cartas:</p>
<button id="btn-comenzar" class="btn btn-pink mb-3">
  💫 Comenzar Juego
</button>
<div id="contador" style="display: none; font-size: 1.5rem; font-weight: bold; color: #ff69b4;">
  Comenzando en <span id="cuenta">3</span>...
</div>

  <div id="memorama"></div>
  <p id="intentos" class="mt-3">Intentos: 0</p>
  <div id="mensaje-ganar" style="display: none; margin-top: 20px; font-weight: bold; color: #5cb85c;">
    ¡Felicidades, encontraste todos los pares! 💖
  </div>
  <button id="btn-reiniciar" style="display: none; margin-top: 20px;" class="btn btn-pink">
  🔄 Volver a Jugar
</button>

</div>


<style>
    #memorama, #intentos, #mensaje-ganar, #btn-reiniciar {
  display: none;
}

#memorama {
  display: grid;
  grid-template-columns: repeat(4, 100px);
  gap: 10px;
  justify-content: center;
  margin: auto;
  margin-top: 20px;
}

.carta {
  width: 100px;
  height: 100px;
  perspective: 1000px;
  cursor: pointer;
}

.contenido-carta {
  width: 100%;
  height: 100%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
  position: relative;
}

.carta.volteada .contenido-carta {
  transform: rotateY(180deg);
}

.cara {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 10px;
  backface-visibility: hidden;
}

.frente {
  background-color: #fce4ec;
  border: 2px dashed #ec407a;
}

.dorso {
  transform: rotateY(180deg);
  background-size: cover;
  background-position: center;
}
#juego-memoria h2 {
  font-family: 'Comic Sans MS', cursive;
  color: #ff80ab;
  margin-bottom: 10px;
}

#juego-memoria p {
  color: #6a1b9a;
  font-size: 1.1rem;
  font-weight: 500;
}

#intentos {
  background-color: #f8bbd0;
  padding: 8px 16px;
  border-radius: 10px;
  display: inline-block;
  font-weight: bold;
  color: #880e4f;
}

#mensaje-ganar {
  background-color: #c8e6c9;
  padding: 15px;
  border-radius: 15px;
  color: #2e7d32;
  font-size: 1.2rem;
  animation: pulse 1s infinite alternate;
}

@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.05); }
}

.btn-pink {
  background-color: #f48fb1;
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: bold;
  transition: background-color 0.3s, transform 0.2s;
  font-family: 'Comic Sans MS', cursive;
}

.btn-pink:hover {
  background-color: #f06292;
  transform: scale(1.05);
}

</style>

<!--SCRIPT DE MEMORAMA-->
<script>
const imagenes = [
  "{% static 'img/fondo_pochacco.jpg' %}", 
  "{% static 'img/pochacco_1.jpg' %}", 
  "{% static 'img/pochacco_flecha.jpg' %}", 
  "{% static 'img/pochacco_heart.jpg' %}",    
  "{% static 'img/pochacco_kiss.jpg' %}", 
  "{% static 'img/pochacco_music.png' %}", 
  "{% static 'img/pochacco1.jpg' %}", 
  "{% static 'img/pochacco_face.jpg' %}"  
];

let cartas = [...imagenes, ...imagenes]; // 8 pares
cartas = cartas.sort(() => 0.5 - Math.random());

const contenedor = document.getElementById("memorama");
let seleccionadas = [];
let bloqueadas = false;
let intentos = 0;
let parejasEncontradas = 0;

function crearCarta(src, index) {
  const carta = document.createElement("div");
  carta.className = "carta";
  carta.dataset.index = index;

  const contenido = document.createElement("div");
  contenido.className = "contenido-carta";

  const frente = document.createElement("div");
  frente.className = "cara frente";

  const dorso = document.createElement("div");
  dorso.className = "cara dorso";
  dorso.style.backgroundImage = `url(${src})`;

  contenido.appendChild(frente);
  contenido.appendChild(dorso);
  carta.appendChild(contenido);

  carta.addEventListener("click", () => {
    if (bloqueadas || carta.classList.contains("volteada")) return;

    carta.classList.add("volteada");
    seleccionadas.push({ carta, src });

    if (seleccionadas.length === 2) {
      bloqueadas = true;
      intentos++;
      document.getElementById("intentos").textContent = `Intentos: ${intentos}`;

      if (seleccionadas[0].src === seleccionadas[1].src) {
        parejasEncontradas++;
        seleccionadas = [];
        bloqueadas = false;

        if (parejasEncontradas === imagenes.length) {
            document.getElementById("mensaje-ganar").style.display = "block";
            document.getElementById("btn-reiniciar").style.display = "inline-block";
        }

      } else {
        setTimeout(() => {
          seleccionadas.forEach(({ carta }) => carta.classList.remove("volteada"));
          seleccionadas = [];
          bloqueadas = false;
        }, 1000);
      }
    }
  });

  return carta;
}


const contador = document.getElementById("contador");
const cuentaElem = document.getElementById("cuenta");

function iniciarJuego() {
  seleccionadas = [];
  bloqueadas = false;
  intentos = 0;
  parejasEncontradas = 0;
  document.getElementById("intentos").textContent = `Intentos: 0`;
  document.getElementById("mensaje-ganar").style.display = "none";
  document.getElementById("btn-reiniciar").style.display = "none";

  contenedor.innerHTML = "";
  cartas = [...imagenes, ...imagenes].sort(() => 0.5 - Math.random());
  cartas.forEach((src, i) => {
    const carta = crearCarta(src, i);
    carta.classList.add("volteada");
    contenedor.appendChild(carta);
  });

  // Mostrar cartas por 4 segundos
  let tiempo = 5;
  cuentaElem.textContent = tiempo;
  contador.style.display = "block";

  let cuentaAtras = setInterval(() => {
    tiempo--;
    cuentaElem.textContent = tiempo;
    if (tiempo === 0) {
      clearInterval(cuentaAtras);
      contador.style.display = "none";
      document.querySelectorAll(".carta").forEach(carta => carta.classList.remove("volteada"));
    }
  }, 1000);
}


document.getElementById("btn-reiniciar").addEventListener("click", () => {
  // Reiniciar variables
  seleccionadas = [];
  bloqueadas = false;
  intentos = 0;
  parejasEncontradas = 0;
  document.getElementById("intentos").textContent = `Intentos: 0`;
  document.getElementById("mensaje-ganar").style.display = "none";
  document.getElementById("btn-reiniciar").style.display = "none";

  // Limpiar tablero
  contenedor.innerHTML = "";

  // Rebarajar cartas
  cartas = [...imagenes, ...imagenes].sort(() => 0.5 - Math.random());

  // Volver a crear cartas
  cartas.forEach((src, i) => {
    const carta = crearCarta(src, i);
    carta.classList.add("volteada");
    contenedor.appendChild(carta);
  });

  // Mostrar el contador otra vez
  let tiempo = 3;
  cuentaElem.textContent = tiempo;
  contador.style.display = "block";

  const intervalo = setInterval(() => {
    tiempo--;
    cuentaElem.textContent = tiempo;

    if (tiempo === 0) {
      clearInterval(intervalo);
      contador.style.display = "none";
      document.querySelectorAll(".carta").forEach(carta => {
        carta.classList.remove("volteada");
      });
    }
  }, 1000);
});

document.getElementById("btn-comenzar").addEventListener("click", () => {
  document.getElementById("btn-comenzar").style.display = "none";
  document.getElementById("memorama").style.display = "grid";
  document.getElementById("intentos").style.display = "block";
  iniciarJuego();
});

</script>

</body>
</html>
