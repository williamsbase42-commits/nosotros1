  <h2 style="text-align: center; color: #d63384;">🧩 Sudoku del Amor</h2>

      <!-- Opciones se llenan con JS -->
    </select>
  </div>

  <div id="sudoku-grid" style="display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; margin: auto; max-width: 450px;"></div>
  <div id="sudoku-numeros" style="display: flex; justify-content: center; margin-top: 1rem; gap: 0.5rem; flex-wrap: wrap; max-width: 450px; margin-left: auto; margin-right: auto;"></div>
  <div style="text-align: center; margin-top: 1rem;">
    <button id="modoLapiz" style="padding: 0.4rem 1rem; border-radius: 10px; border: 2px solid #d63384; background: white; color: #d63384; font-weight: bold; cursor: pointer;">✏️ Modo Lápiz: OFF</button>
    <button id="siguienteNivel" style="padding: 0.4rem 1rem; border-radius: 10px; border: none; background: #d63384; color: white; font-weight: bold; cursor: pointer; margin-left: 1rem; display:none;">➡️ Siguiente Nivel</button>
    <button id="reiniciarJuego" style="padding: 0.4rem 1rem; border-radius: 10px; border: none; background: #d63384; color: white; font-weight: bold; cursor: pointer; margin-left: 1rem; display:none;">🔄 Reiniciar</button>
  </div>
</div>

<style>
  #sudoku-grid {
    margin: 0 auto;
    width: 100%;
    max-width: 450px;
  }

  .sudoku-cell {
    width: 100%;
    aspect-ratio: 1 / 1;
    text-align: center;
    vertical-align: middle;
    line-height: 40px;
    font-size: 20px;
    border: 1px solid #ccc;
    cursor: pointer;
    background-color: #fff0f6;
    font-weight: bold;
    user-select: none;
    position: relative;
  }

  .sudoku-cell.fixed {
    background-color: #ffe6ef;
    color: #c2185b;
    font-weight: bold;
    cursor: default;
  }

  .sudoku-cell.selected {
    border: 2px solid #d63384;
    background-color: #ffebf2;
  }

  .sudoku-cell.error {
    background-color: #ffccd5;
    animation: shake 0.2s linear 2;
  }

  .sudoku-num {
    width: 40px;
    height: 40px;
    background-color: #fff0f6;
    border: 1px solid #d63384;
    border-radius: 10px;
    text-align: center;
    line-height: 40px;
    cursor: pointer;
    font-weight: bold;
    font-size: 18px;
    color: #d63384;
    transition: 0.3s;
    user-select: none;
  }

  .sudoku-num.usado {
    background-color: #d4edda;
    color: #28a745;
    text-decoration: line-through;
    cursor: default;
  }

  /* Separación 3x3 */
  .top-border {
    border-top: 3px solid #d63384 !important;
  }

  .left-border {
    border-left: 3px solid #d63384 !important;
  }

  /* Modo lápiz (notas) */
  .pencil-notes {
    position: absolute;
    top: 2px;
    left: 2px;
    right: 2px;
    bottom: 2px;
    font-size: 8px;
    color: #999;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-content: flex-start;
  }

  .pencil-note {
    width: 10px;
    height: 10px;
    text-align: center;
    user-select: none;
  }

  @keyframes shake {
    0% { transform: translateX(0px); }
    25% { transform: translateX(-3px); }
    50% { transform: translateX(3px); }
    75% { transform: translateX(-3px); }
    100% { transform: translateX(0px); }
  }
  .vidas {
  font-size: 2rem;
  color: #ff4d6d; /* color romántico, rojo suave */
  user-select: none;
  margin-bottom: 10px;
  transition: transform 0.3s ease;
}

.vidas.perdida {
  transform: scale(1.3);
  color: #d63c54;
}

</style>

      tablero[r] = [];
      tableroFijo[r] = [];

        const cell = document.createElement('div');
        cell.classList.add('sudoku-cell');

        if(r%3===0) cell.classList.add('top-border');
        if(c%3===0) cell.classList.add('left-border');

          cell.classList.add('fixed');
          tablero[r][c] = puzzle[r][c];
          tableroFijo[r][c] = true;

          tableroFijo[r][c] = false;
          cell.textContent = '';
          cell.addEventListener('click', () => seleccionarCelda(r,c));

        cell.setAttribute('data-r', r);
        cell.setAttribute('data-c', c);
        grid.appendChild(cell);

    seleccionado = null;
    cells.forEach(cell => {

        seleccionado = cell;
        cell.classList.add('selected');
      }
    });
  }

      num.setAttribute('data-num', n);
      num.addEventListener('click', () => onNumeroClick(n));
      numerosCont.appendChild(num);
    }
  }

    if(modoLapiz) {

      if(!tablero[r][c] || typeof tablero[r][c] !== 'object') {
        tablero[r][c] = new Set();
      }
      if(tablero[r][c].has(n)) {
        tablero[r][c].delete(n);
      } else {
        tablero[r][c].add(n);
      }
      actualizarCeldaNotas(r,c);
    } else {
      // Modo normal: validar y poner número
      colocarNumero(r,c,n);
    }
  }

    const cells = grid.querySelectorAll('.sudoku-cell');

          container.classList.add('pencil-notes');
          for(let i=1; i<=9; i++) {
            const note = document.createElement('div');
            note.classList.add('pencil-note');
            note.textContent = i;
            if(!tablero[r][c].has(i)) note.style.opacity = '0.1';
            container.appendChild(note);
          }
          cell.appendChild(container);
        } else {
          cell.textContent = '';
        }
      }
    });
  }

    const sol = niveles[nivelActual].solution;

      actualizarCeldaNotas(r,c);

        if(parseInt(cell.getAttribute('data-r')) === r && parseInt(cell.getAttribute('data-c')) === c) {

          cell.classList.remove('error');

      actualizarNumerosUsados();

      if(vidas === 0) {
        gameOver();
      }
    }
  }

  // Marcar error visual
  function marcarError(r,c) {
    const cells = grid.querySelectorAll('.sudoku-cell');
    cells.forEach(cell => {
      if(parseInt(cell.getAttribute('data-r')) === r && parseInt(cell.getAttribute('data-c')) === c) {
        cell.classList.add('error');
        setTimeout(() => cell.classList.remove('error'), 800);
      }
    });
  }

  // Actualizar números usados (tachar y desactivar)
  function actualizarNumerosUsados() {
    const nums = numerosCont.querySelectorAll('.sudoku-num');
    for(let n=1; n<=9; n++) {
      let count = 0;
      for(let r=0; r<9; r++) {
        for(let c=0; c<9; c++) {
          if(tablero[r][c] === n) count++;
        }
      }
      if(count === 9) {
        nums[n-1].classList.add('usado');
      } else {
        nums[n-1].classList.remove('usado');
      }
    }
  }

  // Verifica si tablero terminado
  function verificarTerminado() {
    for(let r=0; r<9; r++) {
      for(let c=0; c<9; c++) {
        if(tablero[r][c] === 0 || tablero[r][c] instanceof Set) return false;
      }
    }
    return true;
  }

  // Termina nivel
  function terminarNivel() {
    alert("¡Felicidades! Has completado el nivel.");
    siguienteNivelBtn.style.display = 'inline-block';
    reiniciarBtn.style.display = 'none';
  }

  // Game Over
  function gameOver() {
    alert("Se acabaron tus vidas, reiniciando nivel.");
    reiniciarBtn.style.display = 'inline-block';
    siguienteNivelBtn.style.display = 'none';
  }

  // Reiniciar juego o nivel
  function reiniciarJuego() {
    vidas = 3;
    actualizarVidas();
    dibujarTablero();
    dibujarNumeros();
    modoLapiz = false;
    modoLapizBtn.textContent = "✏️ Modo Lápiz OFF";
    siguienteNivelBtn.style.display = 'none';
    reiniciarBtn.style.display = 'inline-block';
    nivelLabel.textContent = `Nivel ${nivelActual + 1}`;
    seleccionado = null;
  }

  // Cambiar modo lápiz
  modoLapizBtn.addEventListener('click', () => {
    modoLapiz = !modoLapiz;
    modoLapizBtn.textContent = modoLapiz ? "✏️ Modo Lápiz ON" : "✏️ Modo Lápiz OFF";
  });

  // Botones de reinicio y siguiente nivel
  reiniciarBtn.addEventListener('click', reiniciarJuego);
  siguienteNivelBtn.addEventListener('click', () => {
    if(nivelActual < niveles.length - 1) {
      nivelActual++;
      selectorNivel.value = nivelActual;
      reiniciarJuego();
    }
  });

  // Inicialización
  initSelector();
  reiniciarJuego();

})();
</script>
</section>
